[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "netizen-cli"
version = "0.16.1"
description = "Use native Codex threads through a Feishu Channel."
requires-python = ">=3.11,<3.15"
dependencies = [
  "h11==0.16.0",
  "httpx==0.28.1",
  "lark-channel-sdk==1.4.0",
  "lark-oapi==1.7.2",
  "markdown-it-py==4.0.0",
  "mdformat==1.0.0",
  "mdformat-gfm==1.0.0",
  "mcp==2.2.0",
  "openai-codex==0.167.0",
  "psutil==7.2.2",
  "pydantic==2.13.4",
  "PyYAML==6.0.3",
  "qrcode==8.2",
  "truststore==0.10.4; sys_platform == 'darwin'",
  "uvicorn==0.52.4",
]

[project.scripts]
netizen = "netizen_cli.cli:main"

[tool.setuptools.packages.find]
include = ["netizen_cli*"]

[tool.setuptools.cmdclass]
build_py = "_build.BuildPy"

[tool.setuptools.package-data]
"netizen_cli.admin" = ["static/*.html", "static/*.css", "static/*.js", "static/*.svg", "static/vendor/ace/*.js", "static/vendor/ace/LICENSE", "static/vendor/ace/README.md"]

[tool.ruff]
target-version = "py311"
extend-exclude = ["netizen_cli/admin/static"]

[tool.ruff.lint]
# Correctness only: syntax errors, pyflakes and dangling asyncio tasks.
# Formatting and style are not enforced.
select = ["E9", "F", "RUF006"]

[tool.mypy]
python_version = "3.11"
files = ["netizen_cli"]
warn_unused_configs = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
# Third-party packages without inline types or stubs.
module = ["lark_channel", "lark_channel.*", "lark_oapi", "lark_oapi.*", "psutil", "qrcode", "qrcode.*", "yaml"]
ignore_missing_imports = true

# ---- Typing debt baseline -------------------------------------------------------
# Each entry suppresses only the error codes that module still reports. New modules
# are checked in full. Remove a code (or the module) once its errors are fixed;
# never add modules or codes here to land new code.

[[tool.mypy.overrides]]
module = [
    "netizen_cli.admin.auth",
    "netizen_cli.admin.file_previews",
    "netizen_cli.admin.presentation",
    "netizen_cli.bindings",
    "netizen_cli.builtin_skills",
    "netizen_cli.channel.reply_presenter",
    "netizen_cli.channel.session_tools",
    "netizen_cli.cli_update_worker",
