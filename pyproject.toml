    "netizen_cli.management.blocking_io",
    "netizen_cli.management.chat_directory",
    "netizen_cli.message_content",
    "netizen_cli.runtime.lifecycle",
    "netizen_cli.runtime.naming",
    "netizen_cli.runtime.queries",
    "netizen_cli.runtime.state",
    "netizen_cli.sessions.mcp",
    "netizen_cli.sessions.presentation",
    "netizen_cli.sessions.schema",
