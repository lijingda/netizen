[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "netizen"
version = "0.4.3"
description = "Use native Codex threads through a Feishu Channel."
requires-python = ">=3.11,<3.13"
dependencies = [
  "h11==0.16.0",
  "lark-channel-sdk==1.2.0",
  "lark-oapi==1.7.2",
  "openai-codex==0.147.0",
  "pydantic==2.13.4",
  "PyYAML==6.0.3",
  "qrcode==8.2",
  "truststore==0.10.4; sys_platform == 'darwin'",
]

[project.scripts]
netizen = "netizen.main:main"

[tool.setuptools.packages.find]
include = ["netizen*"]

[tool.setuptools.package-data]
"netizen.admin" = ["static/*.html", "static/*.css", "static/*.js"]
