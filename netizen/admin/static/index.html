<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Netizen Admin</title>
  <link rel="stylesheet" href="/static/admin.css">
  <script src="/static/admin.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">INSTANCE CONTROL PLANE</p>
      <h1>Netizen Admin</h1>
    </div>
    <button id="logout" class="quiet">退出登录</button>
  </header>

  <nav class="tabs" aria-label="管理模块">
    <button class="tab active" data-tab="projects" aria-selected="true">Projects</button>
    <button class="tab" data-tab="sessions" aria-selected="false">Sessions</button>
    <button class="tab" data-tab="side-topics" aria-selected="false">Side Topics</button>
  </nav>

  <main>
    <p id="status" class="status" role="status" aria-live="polite"></p>

    <section id="projects" class="panel active" aria-labelledby="projects-heading">
      <div class="section-head">
        <div><p class="eyebrow">WORKSPACES</p><h2 id="projects-heading">Projects</h2></div>
        <button class="refresh" data-refresh="projects">刷新</button>
      </div>
      <div class="forms-grid">
        <form id="register-project" class="card-form">
          <h3>登记已有目录</h3>
          <label>Alias<input name="alias" maxlength="64" required></label>
          <label>绝对路径<input name="path" maxlength="4096" required></label>
          <button type="submit">登记</button>
        </form>
        <form id="create-project" class="card-form">
          <h3>创建空目录</h3>
          <label>Alias<input name="alias" maxlength="64" required></label>
          <label>绝对路径（可留空）<input name="path" maxlength="4096"></label>
          <button type="submit">创建</button>
        </form>
      </div>
      <div class="table-wrap"><table><thead><tr>
        <th>Project</th><th>路径</th><th>状态</th><th>会话</th><th>归档</th><th>最近激活</th><th>操作</th>
      </tr></thead><tbody id="projects-body"></tbody></table></div>
      <button id="projects-next" class="next" hidden>下一页</button>
    </section>

    <section id="sessions" class="panel" aria-labelledby="sessions-heading" hidden>
      <div class="section-head">
        <div><p class="eyebrow">ORDINARY THREADS</p><h2 id="sessions-heading">Sessions</h2></div>
        <button class="refresh" data-refresh="sessions">刷新</button>
      </div>
      <form id="session-filter" class="filter-bar">
        <label>Project<input name="project" maxlength="64"></label>
        <label>Scope
          <select name="scopeKind"><option value="">全部</option><option value="direct">单聊</option><option value="group">群聊</option><option value="topic">话题</option></select>
        </label>
        <label>Chat ID<input name="chatId" maxlength="512"></label>
        <label>Topic ID<input name="topicId" maxlength="512"></label>
        <label>Binding / Thread ID<input name="identity" maxlength="512"></label>
        <label>物化状态
          <select name="materialized"><option value="">全部</option><option value="false">Lazy</option><option value="true">Materialized</option></select>
        </label>
        <label>当前指针
          <select name="current"><option value="">全部</option><option value="true">当前</option><option value="false">非当前</option></select>
        </label>
        <label>原生状态
          <select name="nativeState"><option value="">全部</option><option value="active">Active</option><option value="archived">Archived</option><option value="missing">Missing</option></select>
        </label>
        <label>创建时间从<input name="createdFrom" maxlength="64" placeholder="ISO-8601"></label>
        <label>创建时间至<input name="createdBefore" maxlength="64" placeholder="ISO-8601"></label>
        <label>每页
          <select id="session-page-size" name="pageSize"><option value="10">10</option><option value="20" selected>20</option><option value="50">50</option><option value="100">100</option></select>
        </label>
        <button type="submit">筛选</button>
      </form>
      <div class="table-wrap"><table><thead><tr>
        <th>飞书位置</th><th>类型</th><th>Session</th><th>会话状态</th><th>运行态</th><th>Project</th><th>配置</th><th>操作</th>
      </tr></thead><tbody id="sessions-body"></tbody></table></div>
      <nav class="pagination" aria-label="Sessions 分页">
        <button id="sessions-previous" class="next" disabled>上一页</button>
        <span id="sessions-page" aria-live="polite">第 1 页</span>
        <button id="sessions-next" class="next" disabled>下一页</button>
      </nav>
    </section>

    <section id="side-topics" class="panel" aria-labelledby="sides-heading" hidden>
      <div class="section-head">
        <div><p class="eyebrow">EPHEMERAL THREADS</p><h2 id="sides-heading">Side Topics</h2></div>
        <button class="refresh" data-refresh="side-topics">刷新</button>
      </div>
      <form id="side-filter" class="filter-bar">
        <label>Project<input name="project" maxlength="64"></label>
        <label>Parent Binding<input name="parentBindingId" maxlength="512"></label>
        <label>Chat ID<input name="chatId" maxlength="512"></label>
        <label>Topic ID<input name="topicId" maxlength="512"></label>
        <label>Root Message ID<input name="rootMessageId" maxlength="512"></label>
        <label>状态
          <select name="state"><option value="">全部</option><option value="creating">Creating</option><option value="open">Open</option><option value="closed">Closed</option><option value="failed">Failed</option><option value="expired">Expired</option></select>
        </label>
        <label>创建时间从<input name="createdFrom" maxlength="64" placeholder="ISO-8601"></label>
        <label>创建时间至<input name="createdBefore" maxlength="64" placeholder="ISO-8601"></label>
        <button type="submit">筛选</button>
      </form>
      <div class="table-wrap"><table><thead><tr>
        <th>Side</th><th>Parent / Project</th><th>飞书维度</th><th>状态</th><th>运行态</th><th>操作</th>
      </tr></thead><tbody id="sides-body"></tbody></table></div>
      <button id="sides-next" class="next" hidden>下一页</button>
    </section>
  </main>
</body>
</html>
