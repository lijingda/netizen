# Manual-development example. The managed installers do not copy this file: they generate
# <NETIZEN_ROOT>/config.yaml with account-specific absolute paths and `projects: {}`.
# Replace every /home/your-user path before running Netizen directly.
instance:
  dataDir: /home/your-user/.netizen/state
  # Empty Projects created from Feishu are confined below this directory.
  projectRoot: /home/your-user/projects

# User and chat availability are configured in the Feishu app console. Netizen
# does not maintain a second allowlist.
projects:
  # Default cwd. /new can explicitly select a managed Worktree of this Project.
  test: /home/your-user/projects/test

# Instance-owned Git worktrees; Admin can change these settings for future creates.
# Omitted root uses <instance-root>/worktrees; existing checkouts are not moved.
# No Codex App global configuration or private managed index is modified.
worktrees:
  # root: /home/your-user/.netizen/worktrees
  fetchBeforeCreate: false

channel:
  securityMode: audit

# Optional collaboration-tool ranges; both default to all when omitted.
# Admin can update these at runtime. These rules do not restrict ordinary chat input.
# Each mode is all, only, exclude, or disabled; only/exclude use exact chat IDs.
sessionTools:
  discovery:
    mode: all
    chatIds: []
  readSend:
    mode: all
    chatIds: []

# Required management UI, using this app's Feishu administrator identities.
# It listens on all interfaces for direct access inside the trusted private network.
adminWeb:
  host: 0.0.0.0
  # Omit port for first-start allocation from 8787 through 8886. Once bound,
  # the selected port is written here and stays fixed on subsequent starts.
  # port: 8787
  # Optional advertised hostname or IP; no scheme, port, or path.
  # accessHost: server.example.com

# The app ID and secret live together in the protected netizen profile at
# lark-app/config.json beside this YAML file (directory 0700, file 0600).
# The installer prepares this file; see docs/deployment.md for its JSON format.
# An explicit override must be an absolute path. Lark CLI is optional.
# NETIZEN_LARK_APP_CONFIG=/home/your-user/.netizen/lark-app/config.json
# Setup binds the first administrator through Feishu login or --admin-open-id.
# Administrator membership: <NETIZEN_ROOT>/state/admin-users.json
# Private user credentials: <NETIZEN_ROOT>/credentials/admin-user-tokens.json
# Admin browser sessions stay in memory and require login after service restart.
