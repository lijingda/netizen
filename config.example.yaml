# Manual-development example. The managed installers do not copy this file: they generate
# ~/.netizen/config.yaml with account-specific absolute paths and `projects: {}`.
# Replace every /home/your-user path before running Netizen directly.
instance:
  dataDir: /home/your-user/.netizen/state
  # Empty Projects created from Feishu are confined below this directory.
  projectRoot: /home/your-user/projects

# User and chat availability are configured in the Feishu app console. Netizen
# does not maintain a second allowlist.
projects:
  # All native Codex Threads under this alias share the exact same cwd.
  test: /home/your-user/projects/test

channel:
  securityMode: audit

# Single-administrator management UI. It is enabled by default and listens on
# all interfaces for direct access inside the trusted private network.
adminWeb:
  enabled: true
  host: 0.0.0.0
  port: 8787

# The app ID and secret live together in the protected netizen profile at
# lark-app/config.json beside this YAML file (directory 0700, file 0600).
# The installer prepares this file; see docs/deployment.md for its JSON format.
# An explicit override must be an absolute path. Lark CLI is optional.
# NETIZEN_LARK_APP_CONFIG=/home/your-user/.netizen/lark-app/config.json
# Admin Web supports only a canonical 32-byte base64url credential file.
# NETIZEN_ADMIN_SECRET_FILE=/home/your-user/.netizen/credentials/admin-web-secret
