name: Main quality gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: netizen-main-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - &checkout
        name: Check out source
        uses: actions/checkout@v7

      - &setup-node
        name: Set up Node.js for Admin JavaScript behavior tests
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - &setup-python
        name: Set up supported Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.lock

      - &locked-install
        id: locked-install
        name: Install the locked dependency set
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check --no-input setuptools==80.9.0
          .venv/bin/python -m pip install \
            --disable-pip-version-check \
            --no-input \
            --constraint requirements.lock \
            .
          .venv/bin/python -m pip install \
            --disable-pip-version-check \
            --no-input \
            --constraint requirements.lock \
            --requirement requirements-dev.lock

      - name: Run the repository gate
        run: make check

  # macOS runs on main pushes and manual dispatch only. Release qualification
  # uses the exact main push run; dispatch the workflow on a branch whose change is
  # platform-sensitive (process lifecycle, deployment, packaging, native adapters).
  macos-arm64-check:
    name: macOS arm64 (Python 3.14)
    if: github.event_name != 'pull_request'
    runs-on: macos-15
    env:
      NATIVE_EVIDENCE_ARTIFACT: native-isolated-macos-15
    steps:
      - *checkout

      - *setup-node

      - &setup-python314
        id: setup-python
        name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.lock

      - name: Confirm the standard arm64 runtime
        run: |
          test "$(uname -m)" = arm64
          python - <<'PY'
          import sys

          assert sys.implementation.name == "cpython"
          assert sys.version_info[:2] == (3, 14)
          PY

      - *locked-install

      - name: Verify macOS system trust integration
        run: >-
          .venv/bin/python -I -B -c
          'from netizen_cli.main import _configure_platform_trust;
          _configure_platform_trust()'

      - name: Run the repository gate
        run: make check

      # Keep independent checks running if an earlier check fails.
      - name: Run the isolated group
        if: ${{ !cancelled() && steps.locked-install.outcome == 'success' }}
        timeout-minutes: 120
        env: &native-evidence
          NATIVE_EVIDENCE_DIR: ${{ runner.temp }}/native-evidence
        run: make check-native

      - &upload-native
        name: Upload native regression evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.NATIVE_EVIDENCE_ARTIFACT }}
          path: ${{ runner.temp }}/native-evidence
          retention-days: 14
          if-no-files-found: error

      - name: Build and install the wheel and sdist in separate clean environments
        if: ${{ !cancelled() && steps.setup-python.outcome == 'success' }}
        run: &clean-artifact-installs |
          python -m pip install setuptools==80.9.0
          version=$(python -c 'from netizen_cli import __version__; print(__version__)')
          python scripts/build_cli_distribution.py --tag "v$version" --commit "$GITHUB_SHA" \
            --output-dir "$RUNNER_TEMP/netizen-dist" --smoke-installs

  artifact-installs:
    name: Clean artifact installs (ubuntu-latest, Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - *checkout
      - *setup-python
      - name: Build and install the wheel and sdist in separate clean environments
        run: *clean-artifact-installs

  admin-browser-smoke:
    name: Admin browser smoke (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ["3.14"]
    steps:
      - *checkout
      - *setup-node
      - *setup-python
      - *locked-install

      - name: Run Admin smoke in the preinstalled Chrome
        env:
          CI: 'true'
          NETIZEN_BROWSER_RESULT: ${{ runner.temp }}/admin-browser.json
        run: make check-browser

      - name: Upload browser failure details
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: admin-browser-failure
          path: ${{ runner.temp }}/admin-browser.json
          retention-days: 3

  native-isolated:
    name: Native isolated regression (Linux)
    runs-on: ubuntu-latest
    # The serial isolated deadlines total about 100 minutes, before cleanup and setup.
    timeout-minutes: 120
    env:
      NATIVE_EVIDENCE_ARTIFACT: native-isolated-ubuntu-latest
    steps:
      - *checkout
      - *setup-python314
      - *locked-install

      - name: Run the isolated group
        env: *native-evidence
        run: make check-native

      - *upload-native
