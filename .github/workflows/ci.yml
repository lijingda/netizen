name: One-shot native macOS 0.9.1 to 0.10.0 CLI upgrade

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-version-upgrade:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      SOURCE_SHA: cd00eca3c7467873e366564bc75caff61d5ad88c
      TARGET_SHA: 84fb5ebb2fb4706fc1115f9329bec7a58e31c502
      PIP_CONFIG_FILE: /dev/null
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          path: harness
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: cd00eca3c7467873e366564bc75caff61d5ad88c
          path: source
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 84fb5ebb2fb4706fc1115f9329bec7a58e31c502
          path: candidate
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify exact source, candidate, and disposable GUI context
        shell: bash
        run: |
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git -C candidate rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git -C source status --porcelain)"
          test -z "$(git -C candidate status --porcelain)"
          python - <<'PY'
          import json, os, platform, subprocess
          from pathlib import Path
          root = (Path(os.environ['RUNNER_TEMP']) / 'netizen-version-upgrade').resolve()
          root.mkdir(mode=0o700)
          (root / 'evidence').mkdir(mode=0o700)
          uid = os.geteuid()
          result = subprocess.run(['launchctl', 'print', f'gui/{uid}'], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL, timeout=15)
          identity = {'kind': 'unpublished-cli-version-upgrade', 'source_sha': os.environ['SOURCE_SHA'], 'target_sha': os.environ['TARGET_SHA'], 'harness_sha': os.environ['GITHUB_SHA'], 'platform': platform.platform(), 'uid': uid, 'console_uid': os.stat('/dev/console').st_uid, 'gui_query_returncode': result.returncode, 'image_version': os.environ.get('ImageVersion')}
          (root / 'evidence/runner.json').write_text(json.dumps(identity, indent=2) + '\n')
          assert result.returncode == 0, 'No GUI domain; do not create or alter a session'
          PY
      - name: Build both unchanged source trees and install the old package by name
        shell: bash
        run: |
          acceptance_root="$RUNNER_TEMP/netizen-version-upgrade"
          python -m venv "$acceptance_root/build"
          "$acceptance_root/build/bin/python" -m pip install setuptools==80.9.0 uv==0.12.20
          export SOURCE_DATE_EPOCH="$(git -C source show -s --format=%ct HEAD)"
          "$acceptance_root/build/bin/python" source/scripts/build_cli_distribution.py --output-dir "$acceptance_root/dist-source" --tag v0.9.1 --commit "$SOURCE_SHA"
          export SOURCE_DATE_EPOCH="$(git -C candidate show -s --format=%ct HEAD)"
          "$acceptance_root/build/bin/python" candidate/scripts/build_cli_distribution.py --output-dir "$acceptance_root/dist-target" --tag v0.10.0 --commit "$TARGET_SHA"
          "$acceptance_root/build/bin/python" -m pip download --constraint candidate/requirements.lock --dest "$acceptance_root/wheelhouse" "$acceptance_root/dist-source/netizen_cli-0.9.1-py3-none-any.whl"
          python -m venv "$acceptance_root/A"
          "$acceptance_root/A/bin/python" -m pip install --no-index --find-links "$acceptance_root/wheelhouse" netizen-cli==0.9.1
      - name: Run bounded real version upgrades through the original CLI
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          acceptance_root="$RUNNER_TEMP/netizen-version-upgrade"
          source_sha256="$(shasum -a 256 "$acceptance_root/dist-source/netizen_cli-0.9.1-py3-none-any.whl" | awk '{print $1}')"
          target_sha256="$(shasum -a 256 "$acceptance_root/dist-target/netizen_cli-0.10.0-py3-none-any.whl" | awk '{print $1}')"
          "$acceptance_root/A/bin/python" "$GITHUB_WORKSPACE/harness/scripts/native_cli_version_upgrade.py" --directory "$acceptance_root/run" --python-a "$acceptance_root/A/bin/python" --console-a "$acceptance_root/A/bin/netizen" --uv "$acceptance_root/build/bin/uv" --wheelhouse "$acceptance_root/wheelhouse" --wheel-sha256 "$source_sha256" --target-wheel "$acceptance_root/dist-target/netizen_cli-0.10.0-py3-none-any.whl" --target-wheel-sha256 "$target_sha256"
      - name: Preserve both distributions and bounded acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-macos-cli-0100-upgrade
          path: |
            ${{ runner.temp }}/netizen-version-upgrade/evidence/
            ${{ runner.temp }}/netizen-version-upgrade/run/evidence/
            ${{ runner.temp }}/netizen-version-upgrade/dist-source/
            ${{ runner.temp }}/netizen-version-upgrade/dist-target/
          if-no-files-found: error
          retention-days: 7
