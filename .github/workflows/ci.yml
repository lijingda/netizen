name: One-shot macOS CLI acceptance probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gui-probe:
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - name: Read the isolated runner GUI domain
        shell: bash
        env:
          CANDIDATE_SHA: cd00eca3c7467873e366564bc75caff61d5ad88c
        run: |
          python3 - <<'PYTHON'
          import json, os, platform, subprocess
          from pathlib import Path
          uid = os.geteuid()
          domain = f"gui/{uid}"
          query = subprocess.run(["launchctl", "print", domain], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL, timeout=15)
          report = {"candidate_sha": os.environ["CANDIDATE_SHA"], "harness_sha": os.environ["GITHUB_SHA"], "platform": platform.platform(), "uid": uid, "console_uid": os.stat("/dev/console").st_uid, "image_os": os.environ.get("ImageOS"), "image_version": os.environ.get("ImageVersion"), "gui_domain": domain, "gui_query_returncode": query.returncode, "service_start_verified": False}
          output = Path(os.environ["RUNNER_TEMP"]) / "netizen-gui-probe.json"
          output.write_text(json.dumps(report, indent=2) + "\n")
          print(json.dumps(report, indent=2))
          raise SystemExit(0 if query.returncode == 0 else 78)
          PYTHON
      - name: Preserve the read-only probe result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: netizen-gui-probe
          path: ${{ runner.temp }}/netizen-gui-probe.json
          if-no-files-found: error
          retention-days: 7
