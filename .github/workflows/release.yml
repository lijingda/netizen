# Repository prerequisite: GitHub Immutable Releases must be enabled.  This
# workflow creates a new exact-tag release and never replaces an existing asset.
# Code qualification belongs to the exact main commit's required CI run.  This
# workflow does not rerun tests or account-scoped live probes; it verifies that
# qualification, builds one deterministic artifact, checks its identity, and
# publishes only after approval through the protected `published-release`
# environment.
name: Publish main-qualified release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact existing release tag, for example v0.3.0
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: netizen-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build-artifact:
    runs-on: ubuntu-latest
    outputs:
      archive-name: ${{ steps.identity.outputs.archive-name }}
      archive-sha256: ${{ steps.build.outputs.archive-sha256 }}
      commit: ${{ steps.identity.outputs.commit }}
      main-gate-url: ${{ steps.main-gate.outputs.url }}
    steps:
      - name: Check out exact tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0

      - name: Set up artifact builder
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve exact release identity
        id: identity
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          commit="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          test -n "$commit"
          test "$(git rev-parse HEAD)" = "$commit"
          test -z "$(git status --porcelain --untracked-files=all)"
          version="${RELEASE_TAG#v}"
          test "$RELEASE_TAG" = "v$version"
          echo "archive-name=netizen-$RELEASE_TAG.tar.gz" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - name: Require successful main CI for the exact commit
        id: main-gate
        uses: actions/github-script@v7
        env:
          RELEASE_COMMIT: ${{ steps.identity.outputs.commit }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const expectedCommit = process.env.RELEASE_COMMIT;
            const response = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: 'ci.yml',
              branch: 'main',
              event: 'push',
              head_sha: expectedCommit,
              per_page: 100,
            });
            const successful = response.data.workflow_runs.find((run) =>
              run.head_sha === expectedCommit &&
              run.head_branch === 'main' &&
              run.event === 'push' &&
              run.status === 'completed' &&
              run.conclusion === 'success'
            );
            if (!successful) {
              throw new Error(
                `Exact release commit ${expectedCommit} has no successful main CI run.`
              );
            }
            core.setOutput('url', successful.html_url);
            core.notice(`Reusing successful main qualification: ${successful.html_url}`);

      - name: Build one deterministic candidate and bootstrap
        id: build
        env:
          RELEASE_COMMIT: ${{ steps.identity.outputs.commit }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python scripts/build_release_artifact.py \
            --output-dir dist \
            --tag "$RELEASE_TAG" \
            --commit "$RELEASE_COMMIT" \
            --repository "$RELEASE_REPOSITORY"
          ARCHIVE_PATH="dist/netizen-$RELEASE_TAG.tar.gz" python - <<'PY'
          import hashlib
          import os
          from pathlib import Path

          digest = hashlib.sha256(Path(os.environ["ARCHIVE_PATH"]).read_bytes()).hexdigest()
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"archive-sha256={digest}\n")
          PY

      - name: Preserve exact candidate bytes
        uses: actions/upload-artifact@v4
        with:
          name: release-candidate
          path: |
            dist/${{ steps.identity.outputs.archive-name }}
            dist/install.sh
          if-no-files-found: error
          retention-days: 7

  verify-artifact:
    name: Verify release artifact identity
    needs: build-artifact
    runs-on: ubuntu-latest
    steps:
      - name: Set up artifact verifier
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download the one built candidate
        uses: actions/download-artifact@v4
        with:
          name: release-candidate
          path: dist

      - name: Extract and verify candidate identity
        shell: bash
        env:
          ARCHIVE_NAME: ${{ needs.build-artifact.outputs.archive-name }}
          ARCHIVE_SHA256: ${{ needs.build-artifact.outputs.archive-sha256 }}
          RELEASE_COMMIT: ${{ needs.build-artifact.outputs.commit }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path

          archive = Path("dist") / os.environ["ARCHIVE_NAME"]
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == os.environ["ARCHIVE_SHA256"]
          PY
          mkdir candidate
          tar -xzf "dist/$ARCHIVE_NAME" -C candidate
          source_root="candidate/netizen-$RELEASE_TAG"
          test -d "$source_root"
          SOURCE_ROOT="$source_root" python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["SOURCE_ROOT"])
          manifest = json.loads((root / ".netizen-release.json").read_text())
          assert manifest["schema"] == 1
          assert manifest["commit"] == os.environ["RELEASE_COMMIT"]
          assert manifest["version"] == os.environ["RELEASE_TAG"].removeprefix("v")
          assert manifest["qualification"] == "github-release"
          PY

  publish-release:
    needs: [build-artifact, verify-artifact]
    runs-on: ubuntu-latest
    environment: published-release
    permissions:
      contents: write
    steps:
      - name: Download the main-qualified candidate without rebuilding it
        uses: actions/download-artifact@v4
        with:
          name: release-candidate
          path: dist

      - name: Create draft, upload exact assets, then publish
        uses: actions/github-script@v7
        env:
          ARCHIVE_NAME: ${{ needs.build-artifact.outputs.archive-name }}
          ARCHIVE_SHA256: ${{ needs.build-artifact.outputs.archive-sha256 }}
          MAIN_GATE_URL: ${{ needs.build-artifact.outputs.main-gate-url }}
          RELEASE_COMMIT: ${{ needs.build-artifact.outputs.commit }}
          RELEASE_TAG: ${{ inputs.tag }}
        with:
          script: |
            const crypto = require('crypto');
            const fs = require('fs');
            const path = require('path');
            const { owner, repo } = context.repo;
            const tag = process.env.RELEASE_TAG;
            const expectedCommit = process.env.RELEASE_COMMIT;

            async function resolveTagCommit() {
              let object = (await github.rest.git.getRef({
                owner,
                repo,
                ref: `tags/${tag}`,
              })).data.object;
              const visited = new Set();
              while (object.type === 'tag') {
                if (visited.has(object.sha)) {
                  throw new Error(`Tag ${tag} contains a cycle.`);
                }
                visited.add(object.sha);
                object = (await github.rest.git.getTag({
                  owner,
                  repo,
                  tag_sha: object.sha,
                })).data.object;
              }
              if (object.type !== 'commit') {
                throw new Error(`Tag ${tag} does not resolve to a commit.`);
              }
              return object.sha;
            }

            async function requireExactTag() {
              const actualCommit = await resolveTagCommit();
              if (actualCommit !== expectedCommit) {
                throw new Error(
                  `Tag ${tag} moved: expected ${expectedCommit}, found ${actualCommit}.`
                );
              }
            }

            await requireExactTag();

            const archivePath = path.join('dist', process.env.ARCHIVE_NAME);
            const actualArchiveSha256 = crypto
              .createHash('sha256')
              .update(fs.readFileSync(archivePath))
              .digest('hex');
            if (actualArchiveSha256 !== process.env.ARCHIVE_SHA256) {
              throw new Error('Downloaded release archive no longer matches its built SHA-256.');
            }

            try {
              await github.rest.repos.getReleaseByTag({ owner, repo, tag });
              core.setFailed(`Release ${tag} already exists; immutable assets are never replaced.`);
              return;
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            const created = await github.rest.repos.createRelease({
              owner,
              repo,
              tag_name: tag,
              target_commitish: process.env.RELEASE_COMMIT,
              name: `Netizen ${tag}`,
              body: [
                'This release was built once from an exact main commit whose required',
                'Main quality gate completed successfully.',
                '',
                `Main quality gate: ${process.env.MAIN_GATE_URL}`,
                `Release archive SHA-256: ${process.env.ARCHIVE_SHA256}`,
              ].join('\n'),
              draft: true,
              prerelease: false,
            });

            const assets = [
              [process.env.ARCHIVE_NAME, 'application/gzip'],
              ['install.sh', 'application/x-sh'],
            ];
            for (const [name, contentType] of assets) {
              const data = fs.readFileSync(path.join('dist', name));
              await github.rest.repos.uploadReleaseAsset({
                owner,
                repo,
                release_id: created.data.id,
                name,
                data,
                headers: {
                  'content-type': contentType,
                  'content-length': data.length,
                },
              });
            }

            // Recheck after asset upload despite the active tag ruleset.  The
            // workflow fails closed before release immutability takes effect.
            await requireExactTag();
            const published = await github.rest.repos.updateRelease({
              owner,
              repo,
              release_id: created.data.id,
              draft: false,
            });
            core.notice(`Published immutable release candidate: ${published.data.html_url}`);
